<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijoux - My Jewellery</title>
    <link rel="stylesheet" href="Styles généraux.css">
</head>
<body>
    <!-- En-tête -->
    <header class="header">
        <div class="logo">
            <img src="m.png" alt="Logo My Jewellery">
        </div>
        <h1>Nos Bijoux</h1>
        <a href="site.html" class="retour-accueil">Retour à l'accueil</a>
    </header>

    <!-- Galerie Produits -->
    <section class="product-gallery">
        <div class="product-item">
            <div class="label">Colliers</div>
            <img src="collier1.jpg"Colliers Élégants">
            <h3>Colliers Élégant</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Bracelets</div>
            <img src="bracelet 1.webp" alt="Bracelets Raffinés">
            <h3>Bracelet Raffiné</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">bague</div>
            <img src="bague 2.webp" alt="Bagues Élégantes">
            <h3>bagues brillantes</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">boucles </div>
            <img src="boucle 2.webp" alt="Boucles Élégantes">
            <h3>Boucles Resplendissante</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
    </section>

    <!-- Pied de Page -->
    <footer class="footer">
        <p>&copy; 2024 My Jewellery. Tous droits réservés.</p>
    </footer>
</body>
</html>
