<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijoux - My Jewellery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo"><img src="m.png" alt="Logo My Jewellery"></div>
        <h1>Nos Bijoux</h1>
        <a href="index.html" class="retour-accueil">Retour à l'accueil</a>
    </header>
    <section class="product-gallery">
        <div class="product-item">
            <div class="label">Colliers</div>
            <img src="collier1.jpg" alt="Colliers Élégants">
            <h3>Collier Élégant</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Bracelets</div>
            <img src="bracelet_1.webp" alt="Bracelets Raffinés">
            <h3>Bracelet Raffiné</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Bagues</div>
            <img src="bague_2.webp" alt="Bagues Élégantes">
            <h3>Bagues brillantes</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Boucles d'oreilles</div>
            <img src="boucle_2.webp" alt="Boucles Élégantes">
            <h3>Boucles Resplendissantes</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
    </section>
    <footer class="footer">
        <p>&copy; 2024 My Jewellery. Tous droits réservés.</p>
    </footer>
</body>
</html>
