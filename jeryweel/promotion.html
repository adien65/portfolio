<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions - My Jewellery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo"><img src="m.png" alt="Logo My Jewellery"></div>
        <h1>Nos Promotions</h1>
        <a href="index.html" class="retour-accueil">Retour à l'accueil</a>
    </header>
    <section class="product-gallery">
        <div class="product-item">
            <div class="label">Bagues Promo</div>
            <img src="bague_promo_1.webp" alt="Bagues Promo">
            <h3>-25% sur les Bagues</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Bracelets Promo</div>
            <img src="bracelet_promo_4.webp" alt="Bracelets Promo">
            <h3>-20% sur les Bracelets</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Colliers Promo</div>
            <img src="collier_beau.jpg" alt="Colliers Promo">
            <h3>-30% sur les Colliers</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Boucles Promo</div>
            <img src="boucle_promo_1.webp" alt="Boucles Promo">
            <h3>-35% sur les Boucles</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
    </section>
    <footer class="footer">
        <p>&copy; 2024 My Jewellery. Tous droits réservés.</p>
    </footer>
</body>
</html>
