<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadeaux - My Jewellery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo"><img src="m.png" alt="Logo My Jewellery"></div>
        <h1>Nos Cadeaux</h1>
        <a href="index.html" class="retour-accueil">Retour à l'accueil</a>
    </header>
    <section class="product-gallery">
        <div class="product-item">
            <div class="label">Box Bijoux</div>
            <img src="coffre_bijou_1.jpg" alt="Box Bijoux">
            <h3>Box Bijoux</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Box Colliers</div>
            <img src="collier_beau.jpg" alt="Box Colliers">

            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Box Bracelets</div>
            <img src="coffre_bracelet_3.jpg" alt="Box Bracelets">
            <h3>Box Bracelets Raffinés</h3>
            <a href="commande.html" class="btn">Acheter</a>
        </div>
        <div class="product-item">
            <div class="label">Box Boucles</div>
            <img src="coffret_boucle_1.jpg" alt="Box Boucles">
            <h3>Box Boucles brillantes</h3>
            <a href="commande.html" class="btn">Acheter</a>

    <footer class="footer">
        <p>&copy; 2024 My Jewellery. Tous droits réservés.</p>
